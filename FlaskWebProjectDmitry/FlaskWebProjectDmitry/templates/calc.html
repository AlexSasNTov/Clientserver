<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" type="text/css" href="/static/content/bootstrap.min.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 50px; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2 style="text-align: center; margin-bottom: 20px;">Калькулятор</h2>
        
        <form method="post">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="num1">Первое число:</label>
                <input class="form-control" type="text" name="num1" id="num1" value="{{ num1 }}" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="num2">Второе число:</label>
                <input class="form-control" type="text" name="num2" id="num2" value="{{ num2 }}" required>
            </div>
            
            <button class="btn btn-primary" type="submit" style="width: 100%;">Вычислить сумму</button>
        </form>
        
        {% if result is not none %}
            <div class="alert alert-success" style="margin-top: 20px; font-size: 18px; text-align: center;">
                <strong>Результат: {{ result }}</strong>
            </div>
        {% endif %}

        {% if history %}
            <h4 style="margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 5px;">История вычислений:</h4>
            <ul class="list-group" style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
                {% for row in history %}
                    <li class="list-group-item">{{ row[0] }} + {{ row[1] }} = {{ row[2] }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
</body>
</html>
